# Access transformer for this port. Picked up automatically by ModDevGradle's default convention
# path (src/main/resources/META-INF/accesstransformer.cfg) - no explicit `accessTransformers = ...`
# wiring needed in build.gradle, matching upstream/neo-edition's own build.gradle (its equivalent
# line is present but commented out for the same reason: convention-based pickup already works).
#
# com.hbm.client.render.entity.effect.TorexRenderer#render (CE's screen-shake damage-flash trick,
# `player.hurtDir = 0F;`) needs direct write access to Player#hurtDir, which is `protected` in real
# 1.21.1 vanilla (confirmed by this project's own real compileJava run: "hurtDir has protected
# access in Player"). Widened to public here the exact same confirmed-real way
# upstream/neo-edition's own accesstransformer.cfg does it at this identical neo_version=21.1.228
# (its own NukeTorex.java writes this same `player.hurtDir = 0.0F;` line directly, relying on this
# same AT entry) - not a guess, a literal copy of a real, compiling AT line.
public net.minecraft.world.entity.player.Player hurtDir
# EntityDamageUtil#attackEntityFromIgnoreIFrame reads LivingEntity#lastHurt (protected in 1.21.1).
public net.minecraft.world.entity.LivingEntity lastHurt
# EntityGlyphidBehemoth acid-breath (CE onUpdate) guards on LivingEntity#swinging.
public net.minecraft.world.entity.LivingEntity swinging
